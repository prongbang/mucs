services:
  mucs:
    build: .
    container_name: mucs-service
    ports:
      - "18080:8080"
    # Credentials and tuning live here, untracked. See .env.example.
    env_file: .env
    environment:
      # Only the container's own topology stays in this file, so .env can be
      # copied to a host running `cargo run` without dragging /data along.
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: sqlite:///data/jobs.db?mode=rwc
      WORK_DIR: /data/work
      # Cache the ~300MB model weights so they survive a container restart.
      TORCH_HOME: /data/torch
    volumes:
      - mucs-data:/data
    # 4 cores, and htdemucs wants headroom for the FFT buffers.
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g

volumes:
  mucs-data:
